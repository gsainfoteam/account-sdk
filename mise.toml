[tools]
node = "24.21.0"
pnpm = "12.10.1"
flutter = "3.44.0"

[env]
_.file = ".env"

[tasks.check]
description = "CI 와 같은 검사를 로컬에서 돌린다"
run = ["pnpm typecheck", "pnpm lint", "pnpm build", "pnpm test"]

[tasks."test:live"]
description = "운영과 스테이징 IdP 에 실제로 요청하는 테스트. .env 에 테스트 client 가 있으면 그 흐름도 확인한다"
run = "pnpm --filter @gsainfoteam/account-server test:live"

[tasks."example:api"]
description = "examples/nest 를 스테이징 IdP 에 붙여 띄운다"
run = "pnpm --filter @gsainfoteam/account-example-nest build && pnpm --filter @gsainfoteam/account-example-nest start"

[tasks."example:web"]
description = "examples/web 개발 서버를 띄운다. example:api 와 함께 쓴다"
run = "pnpm --filter @gsainfoteam/account-example-web dev"
