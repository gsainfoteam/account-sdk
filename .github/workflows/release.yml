name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # trusted publisher가 stage만 허용하므로 npmjs.com에서 승인해야 공개된다.
      - run: pnpm stage publish -r --access public --no-git-checks

  flutter:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          install_args: flutter

      - name: Authenticate to pub.dev after the last third-party action
        uses: dart-lang/setup-dart@v1

      - id: published
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if curl -sf -o /dev/null "https://pub.dev/api/packages/gsainfoteam_account/versions/$version"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: packages/flutter

      - if: steps.published.outputs.skip != 'true'
        run: flutter pub get
        working-directory: packages/flutter

      - if: steps.published.outputs.skip != 'true'
        run: flutter pub publish --force
        working-directory: packages/flutter
